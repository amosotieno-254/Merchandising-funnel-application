# Production stack: infra from docker-compose.yml plus every backend and frontend.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Everything client-facing is reached through nginx on http://localhost/
# (see nginx/default.conf; set GATEWAY_PORT to publish on a port other than 80):
#
#   /vendor/  /procurement/  /inventory/  /receiving/  /warehouse/
#
# Frontends are built with `vite build` (base = VITE_BASE_PATH) and served by
# `vite preview`; nginx routes /<app>/api/* to the matching backend.

x-backend-build: &backend-build
  context: .
  dockerfile_inline: |
    FROM node:22-alpine
    WORKDIR /app
    COPY . .
    RUN npm ci

x-frontend-build: &frontend-build
  context: .
  dockerfile_inline: |
    FROM node:22-alpine
    ARG APP_DIR
    ARG VITE_BASE_API
    ARG VITE_VENDOR_API
    ARG VITE_BASE_PATH=/
    ENV VITE_BASE_API=$${VITE_BASE_API} VITE_VENDOR_API=$${VITE_VENDOR_API} VITE_BASE_PATH=$${VITE_BASE_PATH}
    WORKDIR /app
    COPY $${APP_DIR}/package.json $${APP_DIR}/package-lock.json ./
    RUN npm ci
    COPY $${APP_DIR}/ ./
    RUN npm run build
    EXPOSE 4173
    CMD ["npx", "vite", "preview", "--host", "0.0.0.0", "--port", "4173"]

x-backend: &backend
  image: mms-backend:latest
  restart: unless-stopped
  command: ["npx", "tsx", "src/index.ts"]

x-frontend: &frontend
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- infra

  vendor-db:
    image: postgres:16
    container_name: mms-vendor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vendor
      POSTGRES_PASSWORD: vendor
      POSTGRES_DB: vendor_db
    ports:
      - "5433:5432"
    volumes:
      - vendor-data:/var/lib/postgresql/data

  procurement-db:
    image: postgres:16
    container_name: mms-procurement-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: procurement
      POSTGRES_DB: procurement_db
    ports:
      - "5434:5432"
    volumes:
      - procurement-data:/var/lib/postgresql/data

  inventory-db:
    image: postgres:16
    container_name: mms-inventory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory_db
    ports:
      - "5435:5432"
    volumes:
      - inventory-data:/var/lib/postgresql/data

  receiving-db:
    image: postgres:16
    container_name: mms-receiving-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: receiving
      POSTGRES_PASSWORD: receiving
      POSTGRES_DB: receiving_db
    ports:
      - "5436:5432"
    volumes:
      - receiving-data:/var/lib/postgresql/data

  warehouse-db:
    image: postgres:16
    container_name: mms-warehouse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse_db
    ports:
      - "5437:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: mms-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: mms
      RABBITMQ_DEFAULT_PASS: mms
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    # The broker takes ~30s to open :5672; backends wait for this to pass.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  # ---------------------------------------------------------------- vendor (api :3001)

  vendor-api:
    <<: *backend
    build: *backend-build
    container_name: mms-vendor-api
    working_dir: /app/packages/vendor-management/backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://vendor:vendor@vendor-db:5432/vendor_db
      RABBITMQ_URL: amqp://mms:mms@rabbitmq:5672
    ports:
      - "3001:3001"
    depends_on:
      vendor-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  vendor-web:
    <<: *frontend
    build:
      <<: *frontend-build
      args:
        APP_DIR: packages/vendor-management/frontend
        VITE_BASE_PATH: /vendor/
        VITE_BASE_API: http://vendor-api:3001
    container_name: mms-vendor-web
    environment:
      VITE_BASE_API: http://vendor-api:3001
    depends_on:
      - vendor-api

  # ---------------------------------------------------------------- procurement (api :3002)

  procurement-api:
    <<: *backend
    build: *backend-build
    container_name: mms-procurement-api
    working_dir: /app/packages/procurement/backend
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgres://procurement:procurement@procurement-db:5432/procurement_db
      RABBITMQ_URL: amqp://mms:mms@rabbitmq:5672
      VENDOR_SERVICE_URL: http://vendor-api:3001
    ports:
      - "3002:3002"
    depends_on:
      procurement-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      vendor-api:
        condition: service_started

  procurement-web:
    <<: *frontend
    build:
      <<: *frontend-build
      args:
        APP_DIR: packages/procurement/frontend
        VITE_BASE_PATH: /procurement/
        VITE_BASE_API: http://procurement-api:3002
        VITE_VENDOR_API: http://vendor-api:3001
    container_name: mms-procurement-web
    environment:
      VITE_BASE_API: http://procurement-api:3002
      VITE_VENDOR_API: http://vendor-api:3001
    depends_on:
      - procurement-api
      - vendor-api

  # ---------------------------------------------------------------- inventory (api :3003)

  inventory-api:
    <<: *backend
    build: *backend-build
    container_name: mms-inventory-api
    working_dir: /app/packages/inventory/backend
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgres://inventory:inventory@inventory-db:5432/inventory_db
      RABBITMQ_URL: amqp://mms:mms@rabbitmq:5672
    ports:
      - "3003:3003"
    depends_on:
      inventory-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  inventory-web:
    <<: *frontend
    build:
      <<: *frontend-build
      args:
        APP_DIR: packages/inventory/frontend
        VITE_BASE_PATH: /inventory/
        VITE_BASE_API: http://inventory-api:3003
    container_name: mms-inventory-web
    environment:
      VITE_BASE_API: http://inventory-api:3003
    depends_on:
      - inventory-api

  # ---------------------------------------------------------------- receiving (api :3004)

  receiving-api:
    <<: *backend
    build: *backend-build
    container_name: mms-receiving-api
    working_dir: /app/packages/receiving/backend
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: postgres://receiving:receiving@receiving-db:5432/receiving_db
      RABBITMQ_URL: amqp://mms:mms@rabbitmq:5672
      PROCUREMENT_SERVICE_URL: http://procurement-api:3002
    ports:
      - "3004:3004"
    depends_on:
      receiving-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      procurement-api:
        condition: service_started

  receiving-web:
    <<: *frontend
    build:
      <<: *frontend-build
      args:
        APP_DIR: packages/receiving/frontend
        VITE_BASE_PATH: /receiving/
        VITE_BASE_API: http://receiving-api:3004
    container_name: mms-receiving-web
    environment:
      VITE_BASE_API: http://receiving-api:3004
    depends_on:
      - receiving-api

  # ---------------------------------------------------------------- warehouse (api :3005)

  warehouse-api:
    <<: *backend
    build: *backend-build
    container_name: mms-warehouse-api
    working_dir: /app/packages/warehouse-operations/backend
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgres://warehouse:warehouse@warehouse-db:5432/warehouse_db
      RABBITMQ_URL: amqp://mms:mms@rabbitmq:5672
    ports:
      - "3005:3005"
    depends_on:
      warehouse-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  warehouse-web:
    <<: *frontend
    build:
      <<: *frontend-build
      args:
        APP_DIR: packages/warehouse-operations/frontend
        VITE_BASE_PATH: /warehouse/
        VITE_BASE_API: http://warehouse-api:3005
    container_name: mms-warehouse-web
    environment:
      VITE_BASE_API: http://warehouse-api:3005
    depends_on:
      - warehouse-api

  # ---------------------------------------------------------------- gateway

  nginx:
    image: nginx:1.27-alpine
    container_name: mms-nginx
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - vendor-web
      - procurement-web
      - inventory-web
      - receiving-web
      - warehouse-web

volumes:
  vendor-data:
  procurement-data:
  inventory-data:
  receiving-data:
  rabbitmq-data:
  warehouse-data:
