openapi: 3.0.3
info:
  title: Procurement Service
  version: 1.0.0
  description: |
    Manages the lifecycle of Purchase Orders (POs), locks in unit costs
    and payment terms at creation, and enforces an approval workflow.
servers:
  - url: http://localhost:3002
    description: Local development
paths:
  /api/v1/purchase-orders:
    get:
      summary: List all purchase orders
      operationId: listPurchaseOrders
      tags: [PurchaseOrders]
      responses:
        '200':
          description: List of purchase orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderListResponse'
    post:
      summary: Create a purchase order (status = DRAFT)
      operationId: createPurchaseOrder
      tags: [PurchaseOrders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePurchaseOrderRequest'
      responses:
        '201':
          description: PO created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '400':
          description: Invalid input
  /api/v1/purchase-orders/{id}:
    get:
      summary: Get a purchase order with its lines
      operationId: getPurchaseOrder
      tags: [PurchaseOrders]
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
      responses:
        '200':
          description: PO with lines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderWithLinesResponse'
        '404':
          description: Purchase order not found
  /api/v1/purchase-orders/{id}/approve:
    post:
      summary: Approve a purchase order (status → APPROVED)
      operationId: approvePurchaseOrder
      tags: [PurchaseOrders]
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
      responses:
        '200':
          description: PO approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '404':
          description: Purchase order not found
components:
  parameters:
    PurchaseOrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    PurchaseOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        supplierId: { type: string, format: uuid }
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, APPROVED, RECEIVED]
        paymentTerms: { type: string, example: "Net 30" }
        totalCost: { type: string, example: "1000.00" }
        createdAt: { type: string, format: date-time }
    PurchaseOrderLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        poId: { type: string, format: uuid }
        productCode: { type: string }
        quantity: { type: integer }
        unitCost: { type: string }
        receivedQuantity: { type: integer }
    CreatePurchaseOrderLine:
      type: object
      required: [productCode, quantity, unitCost]
      properties:
        productCode: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitCost: { type: string, example: "10.00" }
    CreatePurchaseOrderRequest:
      type: object
      required: [supplierId, paymentTerms, lines]
      properties:
        supplierId: { type: string, format: uuid }
        paymentTerms: { type: string }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreatePurchaseOrderLine' }
    PurchaseOrderResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/PurchaseOrder' }
    PurchaseOrderWithLinesResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          allOf:
            - $ref: '#/components/schemas/PurchaseOrder'
            - type: object
              properties:
                lines:
                  type: array
                  items: { $ref: '#/components/schemas/PurchaseOrderLine' }
    PurchaseOrderListResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items: { $ref: '#/components/schemas/PurchaseOrder' }