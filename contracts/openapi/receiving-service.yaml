openapi: 3.0.3
info:
  title: Receiving Service
  version: 1.0.0
  description: |
    Validates incoming physical goods against approved Purchase Orders.
    Records what was actually received, flags shortages/overages/damages,
    and produces a Goods Received Note (GRN). Subscribes to
    PurchaseOrderApproved and publishes GoodsReceived.
servers:
  - url: http://localhost:3004
    description: Local development
paths:
  /api/v1/expected-deliveries:
    get:
      summary: List expected deliveries
      description: |
        Populated asynchronously from PurchaseOrderApproved events.
      operationId: listExpectedDeliveries
      tags: [ExpectedDeliveries]
      responses:
        '200':
          description: A list of expected deliveries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpectedDeliveryListResponse'

  /api/v1/goods-received-notes:
    get:
      summary: List all Goods Received Notes
      operationId: listGoodsReceivedNotes
      tags: [GoodsReceivedNotes]
      responses:
        '200':
          description: A list of GRNs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsReceivedNoteListResponse'
    post:
      summary: Create a Goods Received Note
      description: |
        Validates what arrived against the PO, records received quantities
        and condition, generates a GRN, and publishes GoodsReceived.
      operationId: createGoodsReceivedNote
      tags: [GoodsReceivedNotes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoodsReceivedNoteRequest'
      responses:
        '201':
          description: GRN created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsReceivedNoteResponse'
        '400':
          description: Invalid input

  /api/v1/goods-received-notes/{id}:
    get:
      summary: Get a Goods Received Note with its lines
      operationId: getGoodsReceivedNote
      tags: [GoodsReceivedNotes]
      parameters:
        - $ref: '#/components/parameters/GoodsReceivedNoteId'
      responses:
        '200':
          description: GRN with lines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsReceivedNoteWithLinesResponse'
        '404':
          description: GRN not found

components:
  parameters:
    GoodsReceivedNoteId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ExpectedDelivery:
      type: object
      properties:
        id: { type: string, format: uuid }
        purchaseOrderId: { type: string, format: uuid }
        supplierId: { type: string, format: uuid }
        paymentTerms: { type: string, example: "Net 30" }
        lines:
          type: string
          description: JSON-encoded array of line items
        receivedAt: { type: string, format: date-time }

    GoodsReceivedNote:
      type: object
      properties:
        id: { type: string, format: uuid }
        purchaseOrderId: { type: string, format: uuid }
        supplierId: { type: string, format: uuid }
        status:
          type: string
          enum: [COMPLETE, PARTIAL]
        createdAt: { type: string, format: date-time }

    GoodsReceivedNoteLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        goodsReceivedNoteId: { type: string, format: uuid }
        productCode: { type: string }
        orderedQuantity: { type: integer }
        receivedQuantity: { type: integer }
        condition:
          type: string
          enum: [GOOD, DAMAGED]

    CreateGoodsReceivedNoteLine:
      type: object
      required: [productCode, orderedQuantity, receivedQuantity]
      properties:
        productCode: { type: string, example: "SKU-001" }
        orderedQuantity: { type: integer, minimum: 0 }
        receivedQuantity: { type: integer, minimum: 0 }
        condition:
          type: string
          enum: [GOOD, DAMAGED]
          default: GOOD

    CreateGoodsReceivedNoteRequest:
      type: object
      required: [purchaseOrderId, supplierId, lines]
      properties:
        purchaseOrderId: { type: string, format: uuid }
        supplierId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateGoodsReceivedNoteLine'

    ExpectedDeliveryListResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items: { $ref: '#/components/schemas/ExpectedDelivery' }

    GoodsReceivedNoteListResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items: { $ref: '#/components/schemas/GoodsReceivedNote' }

    GoodsReceivedNoteResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/GoodsReceivedNote' }

    GoodsReceivedNoteWithLinesResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          allOf:
            - $ref: '#/components/schemas/GoodsReceivedNote'
            - type: object
              properties:
                lines:
                  type: array
                  items: { $ref: '#/components/schemas/GoodsReceivedNoteLine' }